# RQ1 代码归属 ground truth —— 构建矩阵
#
# 设计要点
# --------
# * **不 fork 目标仓库**：job 里动态 clone，目标仓库一个都不用改。
# * **fail-fast: false**：一个仓库编不过不能掐掉整个矩阵。构建失败率本身是
#   要报的数（「N 个开源 iOS 应用里只有 K 个能复现构建」），所以失败必须被
#   记录下来，而不是让整批中止。
# * **max-parallel: 5**：GitHub 对 macOS 的并发上限就是 5（Free/Pro 同），
#   写出来是为了让排队行为可预期，不是限流。
# * 矩阵上限是 **256 job/run**，所以目标清单按 batch 切；`make_matrix.py`
#   会在超限时直接失败并告诉你该切多少份，而不是让 GitHub 静默截断。
#
# 第一次 P1 跑（run #1）暴露的四个缺陷，都修在这一版里
# ----------------------------------------------------
# B1 `xcodebuild 2>&1 | tee | tail` 没开 `pipefail`。GitHub 给 run: 的默认
#    shell 是 `bash -e {0}`，但管道的退出码取自最后一个命令（tail），恒为 0。
#    `** BUILD FAILED **` 被吞掉，`steps.xcbuild.outcome` 记成 success，
#    网页上是绿的。—— 这违反本项目一贯口径：「没测」和「测过且通过」不能
#    长得一样。现在 `set -o pipefail`，outcome 说什么就是什么。
# B2 scheme 按字母序取 `schemes[0]`。IceCubesApp 拿到的是 `Account`（一个
#    SPM 库 scheme），产物是 `Account.o` 不是 `.app`。现在由
#    `pick_app_scheme.py` 按 xcodebuild 自报的 PRODUCT_TYPE 判。
# B3 `LD_MAP_FILE_PATH` 写在命令行上是**全局**覆盖，21 个 target 的 Ld 任务
#    全指向同一路径，XCBuild 在计划阶段判 duplicate output 直接拒编（15 秒，
#    一个文件都没编）。现在由 `decide_map_mode.py` 逐仓库量出不撞的写法。
# B4 `ls **/Podfile` —— bash 不开 globstar 时 `**` 等价于 `*`，只看一层，
#    深层的 Podfile / Package.resolved 一律漏掉，依赖解析那步从没生效过。
#    现在用 `find`。
name: build-groundtruth

on:
  workflow_dispatch:
    inputs:
      batch:
        description: 'targets/<batch>.json 里的 batch 名'
        required: true
        default: 'batch01'
      configs:
        description: '构建配置 id，逗号分隔；all = 全矩阵'
        required: true
        default: 'all'
      developer_dir:
        description: '强制某个 Xcode（/Applications/Xcode_16.4.app 这种）；留空 = runner 默认'
        required: false
        default: ''
      runs_on:
        description: 'runner 镜像。macos-latest 上只有 Xcode 26.x；要 16.x 得换旧镜像'
        required: false
        default: 'macos-latest'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.make.outputs.matrix }}
      count: ${{ steps.make.outputs.count }}
      variant_count: ${{ steps.make.outputs.variant_count }}
    steps:
      - uses: actions/checkout@v4
      - id: make
        run: |
          python3 tools/make_matrix.py \
            --targets "targets/${{ inputs.batch }}.json" \
            --configs "${{ inputs.configs }}" >> "$GITHUB_OUTPUT"
      - run: |
          echo "本次矩阵 ${{ steps.make.outputs.count }} 个 job，"\
               "${{ steps.make.outputs.variant_count }} 个待评分变体"

  build:
    needs: plan
    runs-on: ${{ inputs.runs_on || 'macos-latest' }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Pin toolchain
        if: inputs.developer_dir != ''
        run: |
          DD="${{ inputs.developer_dir }}/Contents/Developer"
          [ -d "$DD" ] || { echo "指定的 Xcode 不存在: $DD"; exit 1; }
          echo "DEVELOPER_DIR=$DD" >> "$GITHUB_ENV"

      - name: Show toolchain
        id: toolchain
        run: |
          set -u
          set +e
          V=$(xcodebuild -version 2>&1 | tr '\n' ' ' | sed 's/  */ /g')
          S=$(xcodebuild -showsdks 2>/dev/null | grep -oE 'iphoneos[0-9.]+' | tail -1)
          echo "desc=$V sdk=${S:-?}" >> "$GITHUB_OUTPUT"
          echo "$V sdk=${S:-?}"
          swift --version 2>&1 | head -2

      - name: Clone target at pinned SHA
        run: |
          set -euo pipefail
          git clone --filter=blob:none "https://github.com/${{ matrix.repo }}.git" target
          cd target
          git checkout --detach "${{ matrix.sha }}"
          git rev-parse HEAD

      # CocoaPods 必须在容器探测之前跑完 —— .xcworkspace 是 `pod install`
      # 之后才生成的，先探容器就会探到只有 .xcodeproj，链不上 Pods 的 target。
      - name: CocoaPods
        id: pods
        continue-on-error: true
        working-directory: target
        run: |
          set -uo pipefail
          PODFILE=$(find . -maxdepth 3 -name Podfile -not -path '*/Pods/*' -print -quit) || PODFILE=""
          if [ -z "$PODFILE" ]; then
            echo "did_run=no_podfile" >> "$GITHUB_OUTPUT"
            echo "没有 Podfile，跳过"; exit 0
          fi
          echo "找到 $PODFILE"
          cd "$(dirname "$PODFILE")"
          # --deployment 禁止改动 Podfile.lock：ground truth 必须对应仓库
          # 自己记录的依赖版本，不是解析当天的最新版本。
          # 三条路径各自落一个值。空字符串既像「没跑」又像「跑了但失败」，
          # 这两件事在记账上必须分得开。
          set +e
          if pod install --deployment; then
            echo "did_run=deployment" >> "$GITHUB_OUTPUT"; exit 0
          fi
          pod install
          rc=$?
          [ $rc -eq 0 ] && echo "did_run=fallback_no_deployment" >> "$GITHUB_OUTPUT" \
                        || echo "did_run=FAILED_rc$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Discover container
        id: container
        working-directory: target
        run: |
          set -uo pipefail
          # 浅的优先，同深度里 .xcworkspace 优先于 .xcodeproj。
          #
          # 上一版写死 `-maxdepth 2`，batch01 里 simplex-chat（apps/ios/）和
          # joreilly/BikeShare 因此被判成「没有工程」。工程放在子目录是常态。
          #
          # 路径**分成 flag 和 path 两个输出**。上一版输出一个整串
          # `-workspace ./Little Go.xcworkspace`，注入命令行后被 bash 按空格
          # 切开 —— 带空格的工程名（实测三个）全部构建失败。
          shallowest() {
            find . -maxdepth 4 \
                 \( -name Pods -o -name node_modules -o -name Carthage \
                    -o -name .git -o -name DerivedData \) -prune -o \
                 -name "$1" -not -path '*/*.xcodeproj/*' -print 2>/dev/null \
              | awk -F/ '{print NF-1 "	" $0}' | sort -n -k1,1 -k2,2 \
              | head -1 | cut -f2-
          }
          WS=$(shallowest '*.xcworkspace')
          PJ=$(shallowest '*.xcodeproj')
          DW=$(printf '%s' "$WS" | awk -F/ '{print NF-1}')
          DP=$(printf '%s' "$PJ" | awk -F/ '{print NF-1}')
          FLAG=""; P=""
          if [ -n "$WS" ] && { [ -z "$PJ" ] || [ "$DW" -le "$DP" ]; }; then
            FLAG=workspace; P=$WS
          elif [ -n "$PJ" ]; then
            FLAG=project; P=$PJ
          fi
          if [ -z "$P" ]; then
            echo "verdict=NO_XCODE_CONTAINER" >> "$GITHUB_OUTPUT"
            echo "没有 .xcworkspace / .xcodeproj（已搜到第 4 层，排除 Pods/node_modules/Carthage）"
            exit 1
          fi
          echo "flag=$FLAG"     >> "$GITHUB_OUTPUT"
          echo "path=$P"        >> "$GITHUB_OUTPUT"
          echo "verdict=FOUND"  >> "$GITHUB_OUTPUT"
          echo "container = -$FLAG [$P]"


      - name: Resolve SwiftPM dependencies
        id: spm
        continue-on-error: true
        working-directory: target
        run: |
          set -uo pipefail
          RES=$(find . -maxdepth 6 \( -name Package.resolved -o -name Package.swift \) -print -quit) || RES=""
          if [ -z "$RES" ]; then
            echo "did_run=no_spm" >> "$GITHUB_OUTPUT"
            echo "没有 Package.resolved / Package.swift，跳过"; exit 0
          fi
          echo "找到 $RES"
          set +e
          xcodebuild -resolvePackageDependencies \
            "-${{ steps.container.outputs.flag }}" "${{ steps.container.outputs.path }}"
          rc=$?
          [ $rc -eq 0 ] && echo "did_run=resolved" >> "$GITHUB_OUTPUT" \
                        || echo "did_run=FAILED_rc$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Pick app scheme
        id: scheme
        continue-on-error: true
        working-directory: target
        run: |
          set -uo pipefail
          # GitHub 给 run: 的默认 shell 是 `bash -e {0}`；要记录退出码就得先关掉 -e
          set +e
          mkdir -p "$RUNNER_TEMP/out"
          # 容器路径加引号 —— 带空格的工程名不能再被切开
          xcodebuild "-${{ steps.container.outputs.flag }}" \
                     "${{ steps.container.outputs.path }}" -list -json \
            > "$RUNNER_TEMP/out/schemes.json" 2> "$RUNNER_TEMP/out/list_stderr.txt"
          LIST_RC=$?
          echo "xcodebuild -list rc=$LIST_RC"
          head -5 "$RUNNER_TEMP/out/list_stderr.txt"
          python3 "$GITHUB_WORKSPACE/tools/pick_app_scheme.py" \
            --container-flag "${{ steps.container.outputs.flag }}" \
            --container-path "${{ steps.container.outputs.path }}" \
            --schemes-json "$RUNNER_TEMP/out/schemes.json" \
            --list-rc "$LIST_RC" \
            --list-stderr-file "$RUNNER_TEMP/out/list_stderr.txt" \
            --out "$RUNNER_TEMP/out/schemes_classified.json"
          rc=$?
          # 输出**永远**要写：判不了也是一个判定，不能留一片空白。
          # batch01 里 12 个仓库的 scheme_verdict 是空字符串，正是因为这一步
          # 在写 output 之前就退出了。
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "out" / "schemes_classified.json"
          try:
              d = json.loads(p.read_text(encoding="utf-8"))
          except Exception:
              d = {}
          print("scheme=" + (d.get("chosen") or ""))
          print("verdict=" + (d.get("chosen_verdict") or "SCHEME_STEP_CRASHED"))
          print("elapsed=" + str(d.get("total_elapsed_s") or ""))
          print("probe_mode=" + (d.get("probe_mode") or ""))
          PY
          exit $rc

      # 逐仓库量，不套用别的仓库的结论：单 target 工程和二十几个 target 的
      # 工程，能不能用全局 map 路径本来就不一样。
      - name: Decide map mode
        id: mapmode
        continue-on-error: true
        if: steps.scheme.outputs.scheme != ''
        working-directory: target
        run: |
          set -uo pipefail
          source "$GITHUB_WORKSPACE/tools/map_settings.sh"
          ARGS=()
          for MODE in default per_target global; do
            map_settings_for "$MODE"
            xcodebuild -showBuildSettings -json \
              "-${{ steps.container.outputs.flag }}" "${{ steps.container.outputs.path }}" \
              -scheme "${{ steps.scheme.outputs.scheme }}" \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              "${MAP_SETTINGS[@]}" ${{ matrix.build_settings }} \
              > "$RUNNER_TEMP/bs_$MODE.json" 2>/dev/null
            ARGS+=( "$MODE=$RUNNER_TEMP/bs_$MODE.json" )
          done
          python3 "$GITHUB_WORKSPACE/tools/decide_map_mode.py" \
            --settings "${ARGS[@]}" \
            --github-output "$GITHUB_OUTPUT" \
            --out "$RUNNER_TEMP/out/map_mode.json"

      - name: Build with linker map
        id: xcbuild
        continue-on-error: true
        if: steps.mapmode.outputs.map_mode != ''
        working-directory: target
        run: |
          set -x
          # B1：没有这一行，BUILD FAILED 会被管道吞掉，绿勾变成假阳性。
          set -o pipefail
          source "$GITHUB_WORKSPACE/tools/map_settings.sh"
          map_settings_for "${{ steps.mapmode.outputs.map_mode }}"
          mkdir -p "$RUNNER_TEMP/out"
          # CODE_SIGNING_ALLOWED=NO：CI 上没有证书，签名会直接失败。
          # -destination generic/platform=iOS：不需要模拟器，也避免 arm64 模拟器切片。
          xcodebuild build \
            "-${{ steps.container.outputs.flag }}" "${{ steps.container.outputs.path }}" \
            -scheme "${{ steps.scheme.outputs.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            "${MAP_SETTINGS[@]}" \
            ${{ matrix.build_settings }} \
            2>&1 | tee "$RUNNER_TEMP/out/build.log" | tail -60

      - name: Collect artifacts
        if: always()
        run: |
          set -uo pipefail
          source "$GITHUB_WORKSPACE/tools/map_settings.sh"
          python3 "$GITHUB_WORKSPACE/tools/collect_build_artifacts.py" \
            --derived-data "$RUNNER_TEMP/dd" \
            --out-dir "$RUNNER_TEMP/out" \
            --map-basename "$MAP_BASENAME" \
            --repo "${{ matrix.repo }}" \
            --sha "${{ matrix.sha }}" \
            --config-id "${{ matrix.config_id }}" \
            --build-settings "${{ matrix.build_settings }}" \
            --strip-variants "${{ matrix.strip_variants }}" \
            --toolchain "${{ steps.toolchain.outputs.desc }}" \
            --pods-did-run "${{ steps.pods.outputs.did_run }}" \
            --spm-did-run "${{ steps.spm.outputs.did_run }}" \
            --scheme "${{ steps.scheme.outputs.scheme }}" \
            --scheme-verdict "${{ steps.scheme.outputs.verdict }}" \
            --scheme-elapsed-s "${{ steps.scheme.outputs.elapsed }}" \
            --map-mode "${{ steps.mapmode.outputs.map_mode }}" \
            --map-verdict "${{ steps.mapmode.outputs.map_verdict }}" \
            --build-outcome "${{ steps.xcbuild.outcome }}" \
            --max-bundle-mb 200

      # 绿勾不再等于「编出来了」：这张小表直接写在 job 页上。
      - name: Job summary
        if: always()
        run: |
          set -uo pipefail
          M="$RUNNER_TEMP/out/manifest.json"
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, os
          p = os.environ["RUNNER_TEMP"] + "/out/manifest.json"
          try:
              m = json.load(open(p))
          except Exception as exc:
              print(f"### manifest 读不出来：`{exc}`")
              raise SystemExit(0)
          ok = m.get("usable_for_groundtruth")
          print(f"### {'✅' if ok else '❌'} `{m.get('repo')}` / `{m.get('config_id')}`")
          print()
          print("| 项 | 值 |")
          print("|---|---|")
          for k in ("toolchain", "scheme_verdict", "scheme", "scheme_elapsed_s",
                    "map_verdict", "map_mode", "build_outcome",
                    "maps_found", "maps_by_output_kind", "app_map_bytes",
                    "collect_note", "usable_variants",
                    "usable_for_groundtruth", "bundle_usable"):
              print(f"| {k} | `{m.get(k)}` |")
          print()
          # app bundle：清单这一半的材料在不在，直接写在 job 页上，不用去翻 manifest
          bv = m.get("bundle_verify") or {}
          print("| app bundle | 值 |")
          print("|---|---|")
          for k, val in (("bundle 原始字节", f"{(m.get('bundle_full_bytes') or 0):,}"),
                         ("Mach-O 个数", m.get("bundle_macho_files")),
                         ("PrivacyInfo.xcprivacy 份数", len(m.get("bundle_privacy_manifests") or [])),
                         ("内嵌 bundle 个数", len(m.get("bundle_nested_bundles") or [])),
                         ("丢弃资源 个数/字节", f"{m.get('bundle_dropped_files')} / {(m.get('bundle_dropped_bytes') or 0):,}")):
              print(f"| {k} | `{val}` |")
          print()
          print("| strip 档位 | 包 | 字节 | strip 了几个 | 复检 | 与同档位二进制一致 |")
          print("|---|---|---:|---:|---|---|")
          for var in (m.get("bundle_variants") or []):
              vv = var.get("verify") or {}
              print(f"| `{var.get('strip_style')}` | `{var.get('file')}` | {(var.get('bytes') or 0):,} "
                    f"| {var.get('n_stripped')} | `{vv.get('verdict')}` | `{vv.get('matches_binary')}` |")
          print()
          print("| 变体 | strip 跑了 | nsyms 前→后 | 字节 前→后 | 保布局 | map 配套 |")
          print("|---|---|---|---|---|---|")
          for v in m.get("variants") or []:
              nb, na = v.get("nsyms_before"), v.get("nsyms_after")
              bb, ba = v.get("binary_bytes_before_strip"), v.get("binary_bytes")
              ns = f"{nb:,} → {na:,}" if (nb is not None and na is not None) else "-"
              sz = f"{bb:,} → {ba:,}" if (bb is not None and ba is not None) else "-"
              print(f"| `{v.get('strip_style')}` | {v.get('strip_did_run')} | {ns} | {sz} "
                    f"| `{v.get('strip_preserves_layout')}` | `{v.get('map_matches_binary')}` |")
              if v.get("note"):
                  print(f"| | | | | | ⚠ {v['note'][:120]} |")
          PY
          cat "$M" 2>/dev/null | head -40

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gt-${{ matrix.slug }}-${{ matrix.config_id }}
          path: ${{ runner.temp }}/out
          # 实测单个 job：主二进制 62 MB + app map 51 MB。905 个 job 按原样
          # 上传就是 ~100 GB。collect 脚本已经只传 bundle map 且全部 gzip
          # （约 25 MB/job），保留期再缩到 7 天，每批跑完尽快拉回本地。
          # 第二轮多了 bundle.ipa：只装分析器会打开的东西（Mach-O、各级
          # Info.plist 与 PrivacyInfo.xcprivacy、entitlements），Assets.car
          # 与图片音频字体 nib 一律不进包，所以它按 MB 计而不是按百 MB 计。
          retention-days: 7
          if-no-files-found: warn

  # 「N 个开源 iOS 应用里只有 K 个能复现构建」—— 这个率是论文外部效度段
  # 必须交代的数，所以它由流水线自己算出来，不靠人事后数绿勾。
  report:
    needs: [plan, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: gt-*
          path: artifacts
      - run: |
          set -uo pipefail
          python3 tools/aggregate_manifests.py \
            --artifacts-dir artifacts \
            --expected "${{ needs.plan.outputs.count }}" \
            --markdown "$GITHUB_STEP_SUMMARY" \
            --out aggregate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gt-aggregate-${{ inputs.batch }}
          path: aggregate.json
          retention-days: 90
